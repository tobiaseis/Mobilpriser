name: Scrape mobilpriser

on:
  schedule:
    # 05:10 UTC hver dag — uden for myldretid, og efter at natlige
    # kampagneskift typisk er slået igennem på siderne.
    - cron: "10 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-mobilpriser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: Sæt pnpm op
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Sæt Node op
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer afhængigheder
        run: pnpm install --frozen-lockfile

      - name: Byg core-pakken
        run: pnpm --filter @mobilpriser/core build

      - name: Kør scraperen
        run: pnpm --filter @mobilpriser/scraper run scrape

      - name: Commit og push opdaterede priser
        run: |
          git config user.name "mobilpriser-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Ingen ændringer i data/ — springer commit over."
          else
            git commit -m "Opdater priser $(date -u +%Y-%m-%d)"
            git push
          fi
