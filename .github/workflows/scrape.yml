name: Scrape mobilpriser

on:
  schedule:
    # 05:10 UTC hver dag — uden for myldretid, og efter at natlige
    # kampagneskift typisk er slået igennem på siderne.
    - cron: "10 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-mobilpriser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: Sæt pnpm op
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Sæt Node op
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer afhængigheder
        run: pnpm install --frozen-lockfile

      - name: Byg core-pakken
        run: pnpm --filter @mobilpriser/core build

      - name: Installer Chromium til sider, der bygges i browseren
        run: pnpm --filter @mobilpriser/scraper exec playwright install --with-deps chromium

      - name: Kør scraperen
        run: pnpm --filter @mobilpriser/scraper run scrape

      - name: Commit og push opdaterede priser
        id: commit
        run: |
          git config user.name "mobilpriser-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Ingen ændringer i data/ — springer commit over."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Opdater priser $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Committet alene er ikke nok. Sitet er statisk: priserne står i
      # siderne fra dengang de blev bygget, så nye tal bliver først synlige,
      # når Vercel har bygget om. Et deploy hook beder om den bygning
      # direkte i stedet for at stole på, at push'et fra denne kørsel
      # udløser den af sig selv.
      - name: Bed Vercel bygge sitet med de nye priser
        if: steps.commit.outputs.changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK mangler. Priserne er committet, men sitet bygges kun om, hvis Vercel selv reagerer på push'et. Opret et deploy hook i Vercel og læg URL'en i repoets secrets."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 -X POST "$DEPLOY_HOOK" -o /dev/null
          echo "Bygning bestilt hos Vercel."
