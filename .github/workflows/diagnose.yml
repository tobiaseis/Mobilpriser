name: Diagnosticer udbydersider

# Kun manuel kørsel. Rapporterer hvad der faktisk står på udbydernes sider,
# så en fejlende parser kan rettes uden selv at kunne åbne dem. Skriver
# intet til data/ og committer ikke.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Begræns til én udbyder (yousee, telenor, telmore, cbb, callme). Tom = alle."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: Sæt pnpm op
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Sæt Node op
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer afhængigheder
        run: pnpm install --frozen-lockfile

      - name: Byg core-pakken
        run: pnpm --filter @mobilpriser/core build

      - name: Installer Chromium til sider, der bygges i browseren
        run: pnpm --filter @mobilpriser/scraper exec playwright install --with-deps chromium

      - name: Diagnosticér siderne
        env:
          PROVIDER: ${{ inputs.provider }}
        run: pnpm --filter @mobilpriser/scraper run diagnose
