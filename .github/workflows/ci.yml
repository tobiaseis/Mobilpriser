name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: Sæt pnpm op
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Sæt Node op
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer afhængigheder
        run: pnpm install --frozen-lockfile

      - name: Byg core-pakken
        run: pnpm --filter @mobilpriser/core build

      - name: Test core-pakken
        run: pnpm --filter @mobilpriser/core test

      - name: Typecheck core-pakken
        run: pnpm --filter @mobilpriser/core typecheck

      - name: Test scraper-pakken
        run: pnpm --filter @mobilpriser/scraper test

      - name: Typecheck scraper-pakken
        run: pnpm --filter @mobilpriser/scraper typecheck

      - name: Typecheck websitet
        run: pnpm --filter @mobilpriser/web typecheck

      - name: Lint websitet
        run: pnpm --filter @mobilpriser/web lint

      - name: Byg websitet
        run: pnpm --filter @mobilpriser/web build
