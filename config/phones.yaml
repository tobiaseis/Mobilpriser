# Telefoner der følges, og de produkt-URLs vi indtil videre har bekræftet
# ved research. En udbyder uden en URL for en given telefon bliver
# stille sprunget over af scraperen (markeret "ikke konfigureret") frem for
# at gætte en URL, der kan vise sig at være forkert.
#
# Flere varianter (farve, 512 GB osv.) og flere udbyder-URLs tilføjes
# efterhånden som de bekræftes mod de rigtige sider — det kræver netadgang
# til de fem sites, som først er til rådighed i selve GitHub Actions-kørslen.

phones:
  - brand: Samsung
    model: Galaxy S26
    storage: 256
    slug: samsung-galaxy-s26-256gb

  - brand: Samsung
    model: Galaxy S26+
    storage: 256
    slug: samsung-galaxy-s26-plus-256gb

  - brand: Samsung
    model: Galaxy S26 Ultra
    storage: 256
    slug: samsung-galaxy-s26-ultra-256gb

  - brand: Apple
    model: iPhone 17
    storage: 256
    slug: iphone-17-256gb

  - brand: Apple
    model: iPhone 17 Pro
    storage: 256
    slug: iphone-17-pro-256gb

# Pr. udbyder: hvilken produkt-URL svarer til hvilken telefon-slug.
#
# URL'er markeret "ikke bekræftet" stammer fra søgeresultater og er ikke set
# hentet igennem endnu. En forkert URL koster kun en advarsel i kørslens
# summary — den kan aldrig producere en forkert pris — så de er billigere at
# afprøve end at gætte sig frem til.
providers:
  # Telmore bygger produktsiden i browseren. Det serverleverede skelet viser
  # "Mindstepris i 6 måneder 0 kr." og "Udsolgt" som pladsholdere — ingen af
  # delene er sande, før JavaScript har udfyldt den valgte variant.
  telmore:
    urls:
      iphone-17-256gb: https://www.telmore.dk/shop/mobiltelefoner/apple/iphone-17
      iphone-17-pro-256gb: https://www.telmore.dk/shop/mobiltelefoner/apple/iphone-17-pro
      # ikke bekræftet — bemærk stort S i "Samsung", som søgeresultatet angav
      samsung-galaxy-s26-256gb: https://www.telmore.dk/shop/mobiltelefoner/Samsung/galaxy-s26-white-256gb
      # ikke bekræftet
      samsung-galaxy-s26-plus-256gb: https://www.telmore.dk/shop/mobiltelefoner/samsung/galaxy-s26-plus
      # ikke bekræftet
      samsung-galaxy-s26-ultra-256gb: https://www.telmore.dk/shop/mobiltelefoner/samsung/galaxy-s26-ultra

  # Bekræftet: siden oplyser "Mindstepris (6 mdr.) 7.733 kr." i serverleveret HTML.
  telenor:
    urls:
      iphone-17-256gb: https://www.telenor.dk/shop/mobil/apple/apple-iphone-17-256gb-purple/
      samsung-galaxy-s26-ultra-256gb: https://www.telenor.dk/shop/mobil/samsung/samsung-galaxy-s26-ultra-256gb-black/

  # CBB svarer 403 på vores identificerede bot. Vi omgår ikke afvisningen
  # (hverken med et andet User-Agent eller via browseren), så udbyderen
  # markeres som "ikke tilgængelig" i hver kørsel, indtil det ændrer sig.
  cbb:
    urls:
      samsung-galaxy-s26-256gb: https://www.cbb.dk/shop/mobiltelefoner/samsung/galaxy-s26/

  # Call me bygger produktsiden i browseren — serveren udleverer kun menuen.
  # Scraperen falder derfor automatisk tilbage til browser-gengivelse her.
  #
  # Bekræftet: siden oplyser "Mindstepris i bindingsperioden" efter gengivelse.
  # Call me sælger telefonen til fuld betaling nu ("betal her og nu 6.499 kr.")
  # frem for afbetaling, plus 6 x 99 kr. abonnement. Derfor ligger deres
  # mindstepriser lavere end konkurrenternes, og S26 og S26 Ultra kun ~500 kr.
  # fra hinanden — forskellen sidder i telefonprisen, ikke i en afbetaling.
  callme:
    urls:
      samsung-galaxy-s26-256gb: https://www.callme.dk/shop/samsung/samsung-galaxy-s26/
      samsung-galaxy-s26-ultra-256gb: https://www.callme.dk/shop/samsung/samsung-galaxy-s26-ultra/

  # YouSee oplyser ikke en samlet mindstepris for telefon + abonnement på
  # produktsiden — det eneste "Mindstepris" dér hører til tilbehør i en
  # "Andre har købt"-karrusel. Til gengæld står telefonens pris med
  # abonnement utvetydigt i JSON-LD'ens Product.offers.price, så YouSees
  # mindstepris regnes ud: telefonpris + 6 x månedspris fra config/plans.yaml.
  # Derfor har YouSee sin egen adapter og markeres med lav konfidens.
  yousee:
    urls:
      iphone-17-256gb: https://yousee.dk/shop/mobiltelefoner/apple/apple-iphone-17/256gb-lavender
      samsung-galaxy-s26-256gb: https://yousee.dk/shop/mobiltelefoner/samsung/galaxy-s26
      samsung-galaxy-s26-ultra-256gb: https://yousee.dk/shop/mobiltelefoner/samsung/galaxy-s26-ultra/256gb-black

  # Norlys sælger kun telefoner sammen med et abonnement med 6 mdr. binding,
  # hvilket passer præcis til sammenligningen.
  norlys:
    urls:
      iphone-17-256gb: https://shop.norlys.dk/shop/apple/apple-iphone-17/
      iphone-17-pro-256gb: https://shop.norlys.dk/shop/apple/apple-iphone-17-pro/
      samsung-galaxy-s26-256gb: https://shop.norlys.dk/shop/samsung/samsung-galaxy-s26/
      samsung-galaxy-s26-ultra-256gb: https://shop.norlys.dk/shop/samsung/samsung-galaxy-s26-ultra/
      # ikke bekræftet — hash-slug som søgeresultatet angav for S26+
      samsung-galaxy-s26-plus-256gb: https://shop.norlys.dk/shop/samsung/samsung-galaxy-s26-a5f38568/

  tre:
    urls:
      iphone-17-256gb: https://www.3.dk/shop/mobiler/apple/iphone-17/
      samsung-galaxy-s26-256gb: https://www.3.dk/shop/mobiler/samsung/samsung-galaxy-s26/
