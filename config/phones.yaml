# Telefoner der følges, og de produkt-URLs vi indtil videre har bekræftet
# ved research. En udbyder uden en URL for en given telefon bliver
# stille sprunget over af scraperen (markeret "ikke konfigureret") frem for
# at gætte en URL, der kan vise sig at være forkert.
#
# Flere varianter (farve, 512 GB osv.) og flere udbyder-URLs tilføjes
# efterhånden som de bekræftes mod de rigtige sider — det kræver netadgang
# til de fem sites, som først er til rådighed i selve GitHub Actions-kørslen.

phones:
  - brand: Samsung
    model: Galaxy S26
    storage: 256
    slug: samsung-galaxy-s26-256gb

  - brand: Samsung
    model: Galaxy S26+
    storage: 256
    slug: samsung-galaxy-s26-plus-256gb

  - brand: Samsung
    model: Galaxy S26 Ultra
    storage: 256
    slug: samsung-galaxy-s26-ultra-256gb

  - brand: Apple
    model: iPhone 17
    storage: 256
    slug: iphone-17-256gb

  - brand: Apple
    model: iPhone 17 Pro
    storage: 256
    slug: iphone-17-pro-256gb

# Pr. udbyder: hvilken produkt-URL svarer til hvilken telefon-slug.
providers:
  # Telmore bygger produktsiden i browseren. Det serverleverede skelet viser
  # "Mindstepris i 6 måneder 0 kr." og "Udsolgt" som pladsholdere — ingen af
  # delene er sande, før JavaScript har udfyldt den valgte variant.
  telmore:
    urls:
      iphone-17-256gb: https://www.telmore.dk/shop/mobiltelefoner/apple/iphone-17
      iphone-17-pro-256gb: https://www.telmore.dk/shop/mobiltelefoner/apple/iphone-17-pro

  # Bekræftet: siden oplyser "Mindstepris (6 mdr.) 7.733 kr." i serverleveret HTML.
  telenor:
    urls:
      iphone-17-256gb: https://www.telenor.dk/shop/mobil/apple/apple-iphone-17-256gb-purple/

  # CBB svarer 403 på vores identificerede bot. Vi omgår ikke afvisningen
  # (hverken med et andet User-Agent eller via browseren), så udbyderen
  # markeres som "ikke tilgængelig" i hver kørsel, indtil det ændrer sig.
  cbb:
    urls:
      samsung-galaxy-s26-256gb: https://www.cbb.dk/shop/mobiltelefoner/samsung/galaxy-s26/

  # Call me bygger produktsiden i browseren — serveren udleverer kun menuen.
  # Scraperen falder derfor automatisk tilbage til browser-gengivelse her.
  callme:
    urls:
      samsung-galaxy-s26-256gb: https://www.callme.dk/shop/samsung/samsung-galaxy-s26/

  yousee:
    urls: {}
