# Forhandlere, der sælger telefonerne fritstående. Deres priser er
# referencen for "er tilbuddet faktisk billigt".
#
# En teleudbyders egen kontantpris duer ikke som reference: den er typisk
# højere end detailhandlens, og bruger man den, kommer ethvert
# abonnementstilbud til at se bedre ud, end det er. Referencen skal svare
# på "kunne jeg gøre det billigere selv", og så er det den pris, man
# faktisk kan købe telefonen til, der er målestokken.
#
# Farve og lager står i URL'en hos alle tre, så varianten er utvetydig.
# Manglende kombinationer springes over med en advarsel frem for at blive
# gættet — en forkert reference ville forplante sig til hver eneste
# vurdering på telefonens side.

retailers:
  # PriceRunner sammenligner allerede på tværs af butikker, så deres
  # laveste pris er en bedre reference end en enkelt forhandlers — og ét
  # sted at hente i stedet for otte. Deres prisdata er samtidig deres
  # produkt, så robots.txt spørges før hver hentning; forbyder den os,
  # springes siden over med en advarsel frem for at blive omgået.
  pricerunner:
    name: PriceRunner
    urls:
      iphone-17-256gb: https://www.pricerunner.dk/pl/1-3431242036/Mobiltelefoner/Apple-iPhone-17-256GB-Black-Sammenlign-Priser
      samsung-galaxy-s26-ultra-256gb: https://www.pricerunner.dk/pl/1-3457318435/Mobiltelefoner/Samsung-Galaxy-S26-Ultra-5G-Smartphone-12-256-GB-Sammenlign-Priser
      # Søgeresultaternes titler og URL'er stemte ikke overens for S26-serien,
      # så her er kun valgt dem, hvor modellen står utvetydigt i URL'en.
      # Rammer en af dem alligevel forkert, vil prisen afvige groft fra
      # Elgigantens for samme telefon, og springet noteres i kørslen.
      samsung-galaxy-s26-256gb: https://www.pricerunner.dk/pl/1-3457402935/Mobiltelefoner/Samsung-Galaxy-S26-256GB-Sky-Blue-Sammenlign-Priser
      samsung-galaxy-s26-plus-256gb: https://www.pricerunner.dk/pl/1-3456297043/Mobiltelefoner/Samsung-Galaxy-S26-Plus-SM-S947-256GB-12GB-Sammenlign-Priser
      # Pixel 11-serien. Model og lager står utvetydigt i alle tre URL'er,
      # hvilket er kravet her efter rodet med S26-serien ovenfor. Farven
      # varierer mellem opslagene — PriceRunner samler alligevel prisen på
      # tværs af butikker, og farve flytter ikke prisen nævneværdigt.
      #
      # Basismodellens produktnavn er nordisk fælles ("aelypuhelin" er
      # finsk for smartphone). Det er PriceRunners eget feed-navn og siger
      # intet om, hvilken butik prisen kommer fra.
      google-pixel-11-256gb: https://www.pricerunner.dk/pl/1-3561682420/Mobiltelefoner/Google-Pixel-11-aelypuhelin-12-256GB-%28obsidian%29-Sammenlign-Priser
      google-pixel-11-pro-256gb: https://www.pricerunner.dk/pl/1-3561682916/Mobiltelefoner/Google-Pixel-11-Pro-12-GB-RAM-256-GB-Pink-Sammenlign-Priser
      google-pixel-11-pro-xl-256gb: https://www.pricerunner.dk/pl/1-3561682901/Mobiltelefoner/Google-Pixel-11-Pro-XL-256-GB-5G-Canyon-Sammenlign-Priser

  elgiganten:
    name: Elgiganten
    urls:
      iphone-17-256gb: https://www.elgiganten.dk/product/mobil-tablet-smartwatch/mobiltelefon/iphone-17-5g-smartphone-256gb-sort/982749
      iphone-17-pro-256gb: https://www.elgiganten.dk/product/mobil-tablet-smartwatch/mobiltelefon/iphone-17-pro-5g-smartphone-256gb-solv/982718
      samsung-galaxy-s26-ultra-256gb: https://www.elgiganten.dk/product/mobil-tablet-smartwatch/mobiltelefon/samsung-galaxy-s26-ultra-5g-smartphone-12256gb-sort/1039737
      samsung-galaxy-s26-256gb: https://www.elgiganten.dk/product/mobil-tablet-smartwatch/mobiltelefon/samsung-galaxy-s26-5g-smartphone-12256gb-sort/1039743
      samsung-galaxy-s26-plus-256gb: https://www.elgiganten.dk/product/mobil-tablet-smartwatch/mobiltelefon/samsung-galaxy-s26-plus-5g-smartphone-12256gb-sort/1039738
      google-pixel-11-pro-256gb: https://www.elgiganten.dk/product/mobil-tablet-smartwatch/mobiltelefon/google-pixel-11-pro-smartphone-12256-gb-obsidian/1122417
      # ikke bekræftet — varenummeret 1122446 er set på Elgigantens svenske
      # site for præcis denne variant, og kæden bruger samme varenummer på
      # tværs af Norden. Selve den danske adresse er ikke set.
      google-pixel-11-pro-xl-256gb: https://www.elgiganten.dk/product/mobil-tablet-smartwatch/mobiltelefon/google-pixel-11-pro-xl-smartphone-12256-gb-obsidian/1122446
      # Basismodellen står her med vilje ikke: Elgiganten ser ud til kun at
      # føre den i 512 GB, og en 512 GB-pris som reference for et 256 GB-tilbud
      # ville gøre hvert eneste tilbud til et røverkøb. PriceRunner dækker den.

  power:
    name: POWER
    urls:
      iphone-17-256gb: https://www.power.dk/mobil-og-foto/mobiltelefoner/apple-iphone-17-256-gb-sort/p-4157177/

  # OiSTER er en forhandler i denne sammenhæng, ikke en udbyder, vi
  # sammenligner. Deres "Mindstepris" er identisk med deres kontantpris —
  # 10.000,- for en iPhone 17 Pro, hvor JSON-LD siger det samme — så den
  # dækker kun telefonen og ikke seks måneders abonnement. Stillet ved
  # siden af de øvrige udbyderes mindstepriser ville de fremstå kunstigt
  # billige, af nøjagtig samme grund som en udbyders kontantpris ikke duer
  # som reference.
  oister:
    name: OiSTER
    urls:
      iphone-17-256gb: https://www.oister.dk/kundeshop/mobiler/apple/iphone-17-256gb/
      iphone-17-pro-256gb: https://www.oister.dk/kundeshop/mobiler/apple/iphone-17-pro-256gb/
      samsung-galaxy-s26-ultra-256gb: https://www.oister.dk/kundeshop/mobiler/samsung/samsung-galaxy-s26-ultra-256gb/

  # Proshop havde de laveste priser i researchen (iPhone 17 256 GB til
  # 6.666 kr.), men produktsidernes URL'er er ikke bekræftet endnu.
  proshop:
    name: Proshop
    urls: {}
