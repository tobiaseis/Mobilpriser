  i samme sætning, som en naiv parser griber i stedet.
-->

<html lang="da">
  <head><title>Testtelefon 300</title></head>
  <body>
    <p class="price-note">
      Mindstepris ved 299&nbsp;kr./md. i 6 mdr.: 4.499&nbsp;kr.
    </p>
  </body>
</html>
